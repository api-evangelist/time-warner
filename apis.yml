aid: time-warner
name: Time Warner
description: >-
  Time Warner was a Fortune 500 American multinational mass media and
  entertainment conglomerate, one of the largest media companies in the world
  until its acquisition by AT&T in 2018. It operated major brands including
  HBO, CNN, Turner Broadcasting, Warner Bros., and DC Comics. After the AT&T
  acquisition it was rebranded as WarnerMedia. In 2022, WarnerMedia merged
  with Discovery Inc. to form Warner Bros. Discovery. Time Warner did not
  offer a public developer API platform.
